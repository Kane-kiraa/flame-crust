name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Alibaba Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIBABA_HOST }}
          username: ${{ secrets.ALIBABA_USER }}
          key: ${{ secrets.ALIBABA_SSH_KEY }}
          port: ${{ secrets.ALIBABA_PORT || 1202 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 Connected to Alibaba Cloud ECS on Port 1202!"
            cd ~/flame-crust
            
            echo "📥 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Deploying backend containers..."
            cd backend
            
            # Setup environment variables for Aiven MySQL
            DB_PASS=$(echo "QVZOU19JRzRhSm1ydVBJV1VjZElWYW1P" | base64 -d)
            echo "SPRING_DATASOURCE_URL=jdbc:mysql://spring-mysql-db-flame-crust.k.aivencloud.com:25875/defaultdb?sslMode=REQUIRED&serverTimezone=UTC" > .env
            echo "SPRING_DATASOURCE_USERNAME=avnadmin" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=${DB_PASS}" >> .env
            echo "MYSQL_URL=jdbc:mysql://spring-mysql-db-flame-crust.k.aivencloud.com:25875/defaultdb?sslMode=REQUIRED&serverTimezone=UTC" >> .env
            echo "MYSQL_USER=avnadmin" >> .env
            echo "MYSQL_PASSWORD=${DB_PASS}" >> .env
            echo "MYSQL_HOST=spring-mysql-db-flame-crust.k.aivencloud.com" >> .env
            echo "MYSQL_PORT=25875" >> .env
            echo "MYSQL_DATABASE=defaultdb" >> .env
            mkdir -p src/main/resources
            cp .env src/main/resources/.env || true
            
            if command -v docker-compose &> /dev/null; then
              docker-compose down || true
              docker-compose up -d --build
            elif command -v docker &> /dev/null; then
              docker compose down || true
              docker compose up -d --build
            else
              echo "⚠️ Docker not found, building with maven..."
              ./mvnw clean package -DskipTests
              if systemctl list-unit-files | grep -q "flame-crust.service"; then
                echo "🔄 Restarting flame-crust systemd service..."
                sudo systemctl restart flame-crust
              else
                echo "🚀 Starting optimized JAR..."
                pkill -f "java.*flame-crust" || true
                nohup java -XX:+UseSerialGC -Xms64m -Xmx180m -XX:MaxMetaspaceSize=96m -jar target/*.jar > backend.log 2>&1 &
              fi
            fi
            
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f || true
            
            echo "✅ Deployment completed successfully!"
