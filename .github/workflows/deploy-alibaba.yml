name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Alibaba Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIBABA_HOST }}
          username: ${{ secrets.ALIBABA_USER }}
          key: ${{ secrets.ALIBABA_SSH_KEY }}
          port: ${{ secrets.ALIBABA_PORT || 1202 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 Connected to Alibaba Cloud ECS on Port 1202!"
            cd ~/flame-crust
            
            echo "📥 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Deploying backend containers..."
            cd backend
            
            if command -v docker-compose &> /dev/null; then
              docker-compose down || true
              docker-compose up -d --build
            elif command -v docker &> /dev/null; then
              docker compose down || true
              docker compose up -d --build
            else
              echo "⚠️ Docker not found, building with maven..."
              ./mvnw clean package -DskipTests
              if systemctl list-unit-files | grep -q "flame-crust.service"; then
                echo "🔄 Restarting flame-crust systemd service..."
                sudo systemctl restart flame-crust
              else
                echo "🚀 Starting optimized JAR..."
                pkill -f "java.*flame-crust" || true
                nohup java -XX:+UseSerialGC -Xms64m -Xmx180m -XX:MaxMetaspaceSize=96m -jar target/*.jar > backend.log 2>&1 &
              fi
            fi
            
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f || true
            
            echo "✅ Deployment completed successfully!"
