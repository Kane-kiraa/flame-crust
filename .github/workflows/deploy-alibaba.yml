name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Alibaba Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIBABA_HOST }}
          username: ${{ secrets.ALIBABA_USER }}
          key: ${{ secrets.ALIBABA_SSH_KEY }}
          passphrase: ${{ secrets.ALIBABA_SSH_PASSPHRASE }} # Optional if key has passphrase
          password: ${{ secrets.ALIBABA_PASSWORD }} # Alternative if using password instead of key
          port: ${{ secrets.ALIBABA_PORT || 22 }}
          script: |
            echo "🚀 Connecting to Alibaba Cloud ECS..."
            cd ~/flame-crust || exit 1
            
            echo "📥 Pulling latest changes from Git..."
            git pull origin main
            
            echo "🐳 Deploying with Docker Compose..."
            cd backend || exit 1
            
            # If you have docker-compose or docker compose:
            if command -v docker-compose &> /dev/null; then
              docker-compose down
              docker-compose up -d --build
            else
              docker compose down
              docker compose up -d --build
            fi
            
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
