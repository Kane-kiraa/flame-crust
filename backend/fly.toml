app = 'backend-flame'
primary_region = 'sin'

# បែងចែក Swap Memory 512MB (ឬ 1024 សម្រាប់ 1GB)
swap_size_mb = 512

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
  memory_mb = 512
